name: Check EUR/KZT

on:
  schedule:
    # Almaty is UTC+5 — these land at roughly 10:00, 14:00 and 18:00 local,
    # which brackets the hours MiG actually moves its board.
    - cron: "0 5,9,13 * * *"
  workflow_dispatch:
    inputs:
      force_email:
        description: "Send an email even if no signal fires (tests SMTP)"
        type: boolean
        default: false

concurrency:
  group: rate-check
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the rate
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          python3 scripts/check_rate.py \
            ${{ inputs.force_email && '--force-email' || '' }}

      - name: Save today's reading
        run: |
          git config user.name  "rate-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --staged --quiet || git commit -m "rate: $(date -u +%Y-%m-%d\ %H:%M) UTC"
          git push
